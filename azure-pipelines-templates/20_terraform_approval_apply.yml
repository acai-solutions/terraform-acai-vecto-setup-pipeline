parameters:
  - name: adoServiceConnectionAwsName
    type: string 
  - name: applyBranch
    type: string
  - name: tfVersion
    type: string
    default: 1.16.6


stages:
  - stage: TerraformApproveAndApply
    displayName: "Terraform AWS-Side Approve & Apply"
    dependsOn:
      - TerraformPreparation
    jobs:
    - job: TerraformShow
      displayName: "Terraform Show Plan"
      steps:
      - checkout: none
      - task: DownloadPipelineArtifact@2 
        displayName: "Download artifact terraform.tfplan.show"
        inputs: 
          buildType: current
          artifactName: terraform.tfplan.show
          targetPath: terraform 

      - bash: |
          cd terraform 
          echo "Show Terraform Plan"
          # defang logging commands of the rendered pipeline files in the plan
          sed 's/##vso\[/##vso [/g' terraform.tfplan.show
        displayName: Show terraform plan

    - job: waitForValidation
      displayName: Wait for manual approval
      condition: |
          and(
            succeeded(),
            eq(variables['Build.SourceBranch'], 'refs/heads/${{ parameters.applyBranch }}'),
            eq(stageDependencies.TerraformPreparation.Preparation.outputs['tfplan.hasChanges'], 'true')
          )
      dependsOn: "TerraformShow"
      pool: server    
      timeoutInMinutes: "4320" # job times out in 3 days
      steps:   
      - task: ManualValidation@0
        timeoutInMinutes: 1440  # task times out in 1 day
        inputs:
            instructions: 'Please validate the build configuration and resume'
            onTimeout: 'reject'

    - job: TerraformApply
      displayName: "Terraform Apply"
      condition:  |
          and(
            succeeded('waitForValidation'),
            eq(variables['Build.SourceBranch'], 'refs/heads/${{ parameters.applyBranch }}')
          )
      dependsOn: "waitForValidation"
      steps:
      - checkout: self
        persistCredentials: true

      - bash: echo "##vso[task.setvariable variable=awsRegionName]$(sed -n 's/^ *target_region *= *"\(.*\)".*/\1/p' settings/vecto-setup.tfvars)"
        displayName: "Read target_region from settings/vecto-setup.tfvars"

      - task: DownloadPipelineArtifact@2 
        displayName: "Download artifact terraform_folder.zip"
        inputs: 
          buildType: 'current' 
          artifactName: 'terraform_folder.zip' 
          targetPath: '.'

      - bash: |
          echo $(System.DefaultWorkingDirectory)
          echo terraform 
          cd $(System.DefaultWorkingDirectory)
          rm -rf terraform 
          unzip terraform_folder.zip 
        displayName: Unzip terraform folder
        
      - task: TerraformInstaller@1
        inputs:
          terraformVersion: ${{ parameters.tfVersion }}

      - task: AWSShellScript@1
        displayName: "Run Terraform apply"
        inputs:
          awsCredentials:  ${{ parameters.adoServiceConnectionAwsName }}
          regionName: $(awsRegionName)
          scriptType: "inline"
          inlineScript: |
            cd terraform
            export AZDO_PERSONAL_ACCESS_TOKEN=$(PAT-VECTO_ADO_MANAGEMENT_ACCESS)
            # const variables are not stored in the plan file
            export TF_VAR_vecto_version=$(sed -n 's/^vecto_version *= *"\(.*\)".*/\1/p' ../settings/vecto-setup.tfvars)
            terraform apply --auto-approve terraform.tfplan
