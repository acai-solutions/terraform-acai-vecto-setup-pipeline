pool:
  vmImage: ubuntu-24.04

# manual runs only: a push would run the default environment
trigger: none

# Environment of this setup run (keep the values in sync with the environments in settings/vecto-setup.tfvars):
# AWS side, <ENV>_ variables in the VECTO variable group and environments/<env>/ files; the primary_environment run also owns the
# VECTO repository, pipeline and files outside environments/ (run it first). State: state_bucket_name of the environment,
# service connection vecto-setup-provisioner-<environment>.
parameters:
- name: environment
  displayName: 'Environment'
  type: string
  default: dev
  values:
  - dev
  - test
  - prod
- name: TF_APPLY_BRANCH
  displayName: 'Apply branch: the apply (with approval) runs only when the pipeline runs on this branch'
  type: string
  default: main

name: "$(Date:yyyyMMdd)$(Rev:.r) - ${{ parameters.environment }}"

variables:
- group: VECTO_ACCESS_TOKEN

# Base Git URL hosting the VECTO Terraform module repository (also in settings/vecto-setup.tfvars, needed before Terraform runs).
# If you host it in your own environment, put your URL.
- name: vectoRepoGitUrl
  value: 'github.com/acai-solutions/'

# Terraform CLI version to be used by the pipelines.
- name: tfVersion
  value: '1.16.6'

stages:
- template: azure-pipelines-templates/10_terraform_preparation.yml
  parameters:
    environment: ${{ parameters.environment }}
    adoServiceConnectionAwsName: vecto-setup-provisioner-${{ parameters.environment }}
    vectoRepoGitUrl: $(vectoRepoGitUrl)
    tfVersion: $(tfVersion)

- template: azure-pipelines-templates/20_terraform_approval_apply.yml
  parameters:
    adoServiceConnectionAwsName: vecto-setup-provisioner-${{ parameters.environment }}
    applyBranch: ${{ replace(parameters.TF_APPLY_BRANCH, 'refs/heads/', '') }}
    tfVersion: $(tfVersion)
